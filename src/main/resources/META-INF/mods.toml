# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory
# A version range to match for said mod loader
loaderVersion = "${loader_version_range}" #mandatory
# The license for your mod.
license = "${mod_license}"

# A list of mods
[[mods]] #mandatory
# The modid of the mod
modId = "${mod_id}" #mandatory
# The version number of the mod
version = "${mod_version}" #mandatory
# A display name for the mod
displayName = "${mod_name}" #mandatory
# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="crabs_spellbooks.png" #optional
# A text field displayed in the mod UI
authors = "${mod_authors}" #optional

# The description text for the mod (multi line!) (#mandatory)
description = '''${mod_description}'''

# Dependencies

# Minecraft Core Dependency
[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Forge Dependency
[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

# Iron's Spells 'n Spellbooks Dependency
[[dependencies."${mod_id}"]]
modId = "irons_spellbooks"
mandatory = true
versionRange = "[1.20.1-3.15.0,)"
ordering = "NONE"
side = "BOTH"

# Curios API Dependency
[[dependencies."${mod_id}"]]
modId = "curios"
mandatory = true
versionRange = "[5.4,)"
ordering = "NONE"
side = "BOTH"