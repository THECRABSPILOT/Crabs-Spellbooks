plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            // Critical Mixin properties for dev environments
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'mixin.debug.export', 'true' // Exports transformed class files to build/mixinouts
            property 'mixin.config', 'mixins.irons_spellbooks.json'

            property 'fml.earlyWindowControl', 'false'
            mods { "${mod_id}" { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.main } }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }

    maven {
        name = "Iron's Maven - Releases"
        url = "https://code.redspace.io/releases"
    }


    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven { url = "https://maven.enginehub.org/repo/" }
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = "https://maven.theillusivec4.top" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.kosmx.dev/" }
    maven { url = "https://modmaven.dev/" }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    // Minecraft & Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Iron's Lib (required by recent Iron's Spellbooks)
    runtimeOnly fg.deobf("io.redspace:irons_lib:${irons_lib_version}")

    // Full Iron's Spellbooks (needed to extend SpellBook)
    implementation fg.deobf("io.redspace:irons_spellbooks:${irons_spells_version}")

    // Curios API
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")

    // GeckoLib
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4")

    // Player Animator
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")

    // Caelus API
    implementation fg.deobf("curse.maven:caelus-308989:5281700")

    //implementation fg.deobf("com.github.alextheshadowmancer:citadel-1.20.1:2.5.4")

    implementation fg.deobf("curse.maven:lionfish-api-1001614:8095554")

    implementation fg.deobf("curse.maven:l_enders-cataclysm-551586:8246047")
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version   : project.findProperty('minecraft_version') ?: '1.20.1',
        minecraft_version_range: project.findProperty('minecraft_version_range') ?: '[1.20.1,1.21)',
        forge_version       : project.findProperty('forge_version') ?: '47.4.18',
        forge_version_range : project.findProperty('forge_version_range') ?: '[47,)',
        loader_version_range: project.findProperty('loader_version_range') ?: '[47,)',
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_license         : project.findProperty('mod_license') ?: 'MIT',
        mod_version         : mod_version,
        mod_authors         : mod_authors,
        mod_description     : mod_description,
        mod_credits         : project.findProperty('mod_credits') ?: '',
        mod_issue_tracker   : project.findProperty('mod_issue_tracker') ?: '',
        mod_display_url     : project.findProperty('mod_display_url') ?: '',
        mod_logo_file       : project.findProperty('mod_logo_file') ?: ''
]

processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.${mod_id}.json"
        ])
    }
    exclude('**/*.psd')
    exclude('**/*.bbmodel')
}

jar.finalizedBy('reobfJar')

java {
    withSourcesJar()
}

artifacts {
    archives sourcesJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}